<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Live Bybit Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0e14; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        #qr-reader video { width: 100% !important; border-radius: 0.75rem; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-sm bg-slate-950 pb-16">

    <!-- SEM VSTAVITE VAŠ RENDER URL -->
    <script>
        const BACKEND_URL = 'https://bybit-backend-xjrm.onrender.com'; // <-- Sem prilepite vaš URL z Renderja!
    </script>

    <!-- Header Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 p-1.5 rounded-lg">
                <i data-lucide="candlestick-chart" class="w-5 h-5 text-black"></i>
            </div>
            <span class="font-bold text-base text-white tracking-wider font-mono">APEX <span class="text-xs text-amber-400">BYBIT</span></span>
        </div>
        <div class="flex items-center gap-2">
            <span id="connection-badge" class="text-[10px] font-mono px-2 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">● SANDBOX</span>
            <button onclick="toggleBYOKModal()" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-black px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/20">
                <i data-lucide="key" class="w-4 h-4"></i>
                <span>Bybit Keys</span>
            </button>
        </div>
    </header>

    <!-- Balance Bar -->
    <div class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-3 space-y-2 text-xs font-mono">
        <div class="flex justify-between items-center">
            <div>
                <span class="text-slate-400">Bybit Balance: </span>
                <span id="account-balance" class="font-bold text-white text-base">$10,000.00</span>
            </div>
            <div>
                <span class="text-slate-400">P&L: </span>
                <span id="total-pnl" class="font-bold text-emerald-400">+$0.00</span>
            </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-xl p-2 flex items-center justify-between">
            <span class="text-amber-400 font-bold flex items-center gap-1">
                <i data-lucide="dollar-sign" class="w-4 h-4"></i> Vložek na trade:
            </span>
            <div class="flex items-center gap-1.5">
                <input type="number" id="trade-amount" value="50" min="5" step="5" class="bg-slate-900 border border-slate-700 rounded-lg text-right px-2 py-1 text-white font-bold w-20 focus:outline-none focus:border-amber-500">
                <span class="text-slate-400 font-bold">USDT</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="p-3 space-y-4 max-w-xl mx-auto w-full">

        <div class="bg-slate-900 border border-slate-800 p-1.5 rounded-xl grid grid-cols-4 gap-1 text-center text-xs font-mono">
            <button onclick="setCategory('CRYPTO')" id="cat-CRYPTO" class="py-2 rounded-lg font-bold bg-amber-500 text-black shadow">CRYPTO</button>
            <button onclick="setCategory('STOCKS')" id="cat-STOCKS" class="py-2 rounded-lg font-bold text-slate-400 hover:text-white">STOCKS</button>
            <button onclick="setCategory('FOREX')" id="cat-FOREX" class="py-2 rounded-lg font-bold text-slate-400 hover:text-white">FOREX</button>
            <button onclick="setCategory('COMMODITIES')" id="cat-COMMODITIES" class="py-2 rounded-lg font-bold text-slate-400 hover:text-white">COMMOD</button>
        </div>

        <div class="bg-slate-900 border border-amber-500/30 p-3.5 rounded-2xl space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                    <i data-lucide="brain-circuit" class="w-5 h-5 text-amber-400"></i>
                    <div>
                        <h2 class="text-xs font-bold text-amber-400 font-mono tracking-wider uppercase">AI TOP 5 SIGNALI</h2>
                        <p class="text-[10px] text-slate-400">Kliknite na signal za izvedbo tradanja</p>
                    </div>
                </div>
                <button onclick="renderSignals()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 p-1.5 rounded-lg flex items-center gap-1 font-mono">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <div id="signals-container" class="space-y-2.5"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-slate-300 font-mono uppercase flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-amber-400"></i> ODPRTI TRADI
                </span>
                <span id="active-trades-count" class="text-xs font-mono bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-bold">0</span>
            </div>

            <div id="active-trades-list" class="space-y-2">
                <div class="text-center py-6 text-slate-500 text-xs font-mono">Ni odprtih pozicij. Kliknite na signal zgoraj.</div>
            </div>
        </div>

    </div>

    <!-- Modal za API ključe -->
    <div id="byok-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden p-4 overflow-y-auto flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 max-w-md w-full mx-auto shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white text-sm flex items-center gap-2">
                    <i data-lucide="key" class="w-4 h-4 text-amber-400"></i> Bybit API Povezava
                </h3>
                <button onclick="toggleBYOKModal()" class="text-slate-400 text-lg">✕</button>
            </div>

            <div class="bg-amber-950/40 border border-amber-500/40 p-3 rounded-xl text-center space-y-2">
                <p class="text-xs text-amber-200">Skenirajte Bybit API Key QR kodo</p>
                <button onclick="startQRScan()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
                    <i data-lucide="camera" class="w-4 h-4"></i> Odpri Kamero za QR
                </button>
                <div id="qr-reader" class="w-full hidden mt-2 border border-emerald-500/50 rounded-xl overflow-hidden"></div>
            </div>

            <div class="space-y-2 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-mono">Bybit API Key</label>
                    <input type="text" id="byok-key" placeholder="Vnesite ali skenirajte API key..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-mono">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-mono">Bybit API Secret</label>
                    <input type="password" id="byok-secret" placeholder="Prilepite Secret key..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-mono">
                </div>
            </div>

            <button onclick="saveBYOKConfig()" class="w-full bg-amber-500 active:bg-amber-600 text-black py-3 rounded-xl font-bold text-xs shadow-lg shadow-amber-500/20">Shrani in Poveži Bybit</button>
        </div>
    </div>

    <script>
        let currentCategory = 'CRYPTO';
        let apiKey = localStorage.getItem('bybit_api_key') || '';
        let apiSecret = localStorage.getItem('bybit_api_secret') || '';
        let isLive = false;
        let balance = 10000.00;
        let activeTrades = [];
        let html5QrCode = null;

        const marketData = {
            CRYPTO: [
                { sym: 'BTCUSDT', label: 'BTC/USD', price: 63965.36, type: 'BUY / LONG', targetP: 65807.56, stopP: 63044.26, gain: '+2.88%' },
                { sym: 'ETHUSDT', label: 'ETH/USD', price: 3519.51, type: 'SELL / SHORT', targetP: 3475.87, stopP: 3541.33, gain: '+1.24%' },
                { sym: 'SOLUSDT', label: 'SOL/USD', price: 143.21, type: 'SELL / SHORT', targetP: 139.19, stopP: 145.23, gain: '+2.81%' },
                { sym: 'BNBUSDT', label: 'BNB/USD', price: 582.40, type: 'BUY / LONG', targetP: 598.10, stopP: 575.00, gain: '+2.69%' },
                { sym: 'XRPUSDT', label: 'XRP/USD', price: 0.584, type: 'BUY / LONG', targetP: 0.612, stopP: 0.570, gain: '+4.79%' }
            ],
            STOCKS: [
                { sym: 'NVDA', label: 'NVDA', price: 124.50, type: 'BUY / LONG', targetP: 128.20, stopP: 122.80, gain: '+2.97%' },
                { sym: 'AAPL', label: 'AAPL', price: 224.20, type: 'SELL / SHORT', targetP: 220.50, stopP: 226.00, gain: '+1.65%' },
                { sym: 'TSLA', label: 'TSLA', price: 251.80, type: 'BUY / LONG', targetP: 262.00, stopP: 247.00, gain: '+4.05%' },
                { sym: 'AMZN', label: 'AMZN', price: 186.40, type: 'BUY / LONG', targetP: 191.00, stopP: 184.10, gain: '+2.46%' },
                { sym: 'MSFT', label: 'MSFT', price: 448.10, type: 'SELL / SHORT', targetP: 441.00, stopP: 451.50, gain: '+1.58%' }
            ],
            FOREX: [
                { sym: 'EURUSD', label: 'EUR/USD', price: 1.0892, type: 'BUY / LONG', targetP: 1.0940, stopP: 1.0870, gain: '+0.44%' },
                { sym: 'GBPUSD', label: 'GBP/USD', price: 1.2985, type: 'BUY / LONG', targetP: 1.3040, stopP: 1.2950, gain: '+0.42%' },
                { sym: 'USDJPY', label: 'USD/JPY', price: 156.40, type: 'SELL / SHORT', targetP: 154.80, stopP: 157.20, gain: '+1.02%' },
                { sym: 'AUDUSD', label: 'AUD/USD', price: 0.6725, type: 'BUY / LONG', targetP: 0.6780, stopP: 0.6700, gain: '+0.81%' },
                { sym: 'USDCAD', label: 'USD/CAD', price: 1.3680, type: 'SELL / SHORT', targetP: 1.3610, stopP: 1.3710, gain: '+0.51%' }
            ],
            COMMODITIES: [
                { sym: 'XAUUSD', label: 'XAU/USD (Zlato)', price: 2415.50, type: 'BUY / LONG', targetP: 2450.00, stopP: 2398.00, gain: '+1.42%' },
                { sym: 'WTI', label: 'Nafta WTI', price: 81.40, type: 'SELL / SHORT', targetP: 79.20, stopP: 82.50, gain: '+2.70%' },
                { sym: 'XAGUSD', label: 'XAG/USD (Srebro)', price: 30.80, type: 'BUY / LONG', targetP: 31.90, stopP: 30.20, gain: '+3.57%' },
                { sym: 'NG', label: 'Plin (Gas)', price: 2.15, type: 'BUY / LONG', targetP: 2.30, stopP: 2.08, gain: '+6.97%' },
                { sym: 'COPPER', label: 'Baker', price: 4.42, type: 'SELL / SHORT', targetP: 4.31, stopP: 4.48, gain: '+2.48%' }
            ]
        };

        lucide.createIcons();

        function setCategory(cat) {
            currentCategory = cat;
            ['CRYPTO', 'STOCKS', 'FOREX', 'COMMODITIES'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                btn.className = c === cat ? 'py-2 rounded-lg font-bold bg-amber-500 text-black shadow' : 'py-2 rounded-lg font-bold text-slate-400 hover:text-white';
            });
            renderSignals();
        }

        function renderSignals() {
            const container = document.getElementById('signals-container');
            container.innerHTML = '';
            const list = marketData[currentCategory];
            list.forEach((item) => {
                const isBuy = item.type.includes('BUY');
                const card = document.createElement('div');
                card.className = "bg-slate-950/80 border border-slate-800 hover:border-amber-500 p-3 rounded-xl cursor-pointer transition active:scale-98 flex justify-between items-center";
                card.onclick = () => executeTrade(item);
                card.innerHTML = `
                    <div class="space-y-1 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold font-mono text-white text-sm">${item.label}</span>
                            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded ${isBuy ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">${item.type}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 font-mono text-[11px] text-slate-400 pt-1">
                            <div>Vstop: <span class="text-slate-200 font-semibold">$${item.price}</span></div>
                            <div>Cilj: <span class="text-emerald-400 font-semibold">$${item.targetP}</span></div>
                            <div>Stop: <span class="text-rose-400 font-semibold">$${item.stopP}</span></div>
                        </div>
                    </div>
                    <div class="text-right pl-2">
                        <span class="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full block mb-1">⚡ ${item.gain}</span>
                        <button class="bg-amber-500 hover:bg-amber-400 text-black font-mono font-bold text-[11px] px-3 py-1.5 rounded-lg shadow">
                            Odpri Trade
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function fetchBybitBalance() {
            if (!apiKey || !apiSecret) return;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, apiSecret })
                });

                const data = await response.json();

                if (data.retCode === 0 && data.result && data.result.list && data.result.list.length > 0) {
                    const wallet = data.result.list[0];
                    let totalEquity = parseFloat(wallet.totalEquity || wallet.totalWalletBalance || 0);
                    
                    if (totalEquity === 0 && wallet.coin) {
                        const usdt = wallet.coin.find(c => c.coin === 'USDT');
                        if (usdt) totalEquity = parseFloat(usdt.walletBalance || 0);
                    }

                    balance = totalEquity;
                    document.getElementById('account-balance').innerText = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                    document.getElementById('connection-badge').innerText = '● LIVE BYBIT CONNECTED';
                    document.getElementById('connection-badge').className = 'text-[10px] font-mono px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
                    isLive = true;
                } else {
                    alert(`Bybit napaka (Koda ${data.retCode}): ${data.retMsg}`);
                }
            } catch (err) {
                alert(`Napaka pri povezavi s strežnikom: ${err.message}`);
            }
        }

        async function executeTrade(signal) {
            const tradeAmountUSD = parseFloat(document.getElementById('trade-amount').value) || 50;
            
            if (tradeAmountUSD > balance) {
                alert(`Nimate dovolj sredstev! Vaše stanje je $${balance.toFixed(2)}, poskušate pa vložiti $${tradeAmountUSD}.`);
                return;
            }

            if (isLive && currentCategory === 'CRYPTO') {
                const side = signal.type.includes('BUY') ? 'Buy' : 'Sell';
                const qty = (tradeAmountUSD / signal.price).toFixed(5);

                try {
                    const res = await fetch(`${BACKEND_URL}/api/order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            apiKey,
                            apiSecret,
                            symbol: signal.sym,
                            side,
                            qty
                        })
                    });
                    
                    const data = await res.json();

                    if (data.retCode === 0) {
                        alert(`Uspešen PRAVI trade na Bybitu za ${signal.label} v vrednosti $${tradeAmountUSD}!`);
                        fetchBybitBalance();
                    } else {
                        alert(`Bybit napaka: ${data.retMsg}`);
                    }
                } catch(e) {
                    alert('Napaka pri izvedbi naročila.');
                }
            } else {
                const tradeId = Date.now();
                const newTrade = { 
                    id: tradeId, 
                    sym: signal.label, 
                    type: signal.type, 
                    entryPrice: signal.price, 
                    currentPrice: signal.price, 
                    amountInvested: tradeAmountUSD,
                    pnl: 0.00 
                };
                activeTrades.push(newTrade);
                renderActiveTrades();
                alert(`Trade za ${signal.label} ($${tradeAmountUSD}) odprt v TESTNEM (Sandbox) načinu.`);
            }
        }

        function renderActiveTrades() {
            const list = document.getElementById('active-trades-list');
            document.getElementById('active-trades-count').innerText = activeTrades.length;
            if(activeTrades.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs font-mono">Ni odprtih pozicij. Kliknite na signal zgoraj.</div>`;
                return;
            }
            list.innerHTML = '';
            activeTrades.forEach((t) => {
                const isPos = t.pnl >= 0;
                card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center font-mono text-xs";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-white text-sm flex items-center gap-2">
                            ${t.sym} <span class="text-[10px] text-amber-400">${t.type}</span>
                        </div>
                        <div class="text-slate-400 text-[11px] mt-0.5">Vložek: $${t.amountInvested} | Live: $${t.currentPrice}</div>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <div>
                            <div class="text-[10px] text-slate-500">P&L</div>
                            <div class="font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'} text-sm">${isPos ? '+' : ''}$${t.pnl.toFixed(2)}</div>
                        </div>
                        <button onclick="closeTrade(${t.id})" class="bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold px-3 py-2 rounded-lg text-xs shadow-lg shadow-rose-600/30">
                            ZAPRI
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function closeTrade(id) {
            const index = activeTrades.findIndex(t => t.id === id);
            if(index !== -1) {
                const closed = activeTrades[index];
                balance += closed.pnl;
                activeTrades.splice(index, 1);
                document.getElementById('account-balance').innerText = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                renderActiveTrades();
            }
        }

        setInterval(() => {
            let totalPnl = 0;
            activeTrades.forEach(t => {
                const tick = (Math.random() - 0.47) * (t.entryPrice * 0.002);
                t.currentPrice = parseFloat((t.currentPrice + tick).toFixed(2));
                const diffPercent = (t.currentPrice - t.entryPrice) / t.entryPrice;
                t.pnl = t.type.includes('BUY') ? t.amountInvested * diffPercent : -t.amountInvested * diffPercent;
                totalPnl += t.pnl;
            });
            if(activeTrades.length > 0) {
                renderActiveTrades();
                const pnlEl = document.getElementById('total-pnl');
                pnlEl.innerText = `${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}`;
                pnlEl.className = `font-bold ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            }
        }, 1200);

        function toggleBYOKModal() { document.getElementById('byok-modal').classList.toggle('hidden'); }

        function startQRScan() {
            const qrDiv = document.getElementById('qr-reader');
            qrDiv.classList.remove('hidden');
            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 200 },
                (decodedText) => {
                    document.getElementById('byok-key').value = decodedText;
                    html5QrCode.stop().then(() => {
                        qrDiv.classList.add('hidden');
                        alert('Bybit API Key prebran!');
                    });
                },
                () => {}
            ).catch(() => alert('Prosimo omogočite dostop do kamere.'));
        }

        function saveBYOKConfig() {
            apiKey = document.getElementById('byok-key').value.trim();
            apiSecret = document.getElementById('byok-secret').value.trim();
            
            if(!apiKey || !apiSecret) {
                alert('Prosimo vnesite oba ključa!');
                return;
            }
            
            localStorage.setItem('bybit_api_key', apiKey);
            localStorage.setItem('bybit_api_secret', apiSecret);
            
            toggleBYOKModal();
            fetchBybitBalance();
        }

        window.onload = () => {
            if(apiKey && apiSecret) {
                document.getElementById('byok-key').value = apiKey;
                document.getElementById('byok-secret').value = apiSecret;
                fetchBybitBalance();
            }
            renderSignals();
        };
    </script>
</body>
</html>
