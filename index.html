<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Trading Terminal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121214; color: #ffffff; padding: 20px; }
        .card { background-color: #1e1e22; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        input { background-color: #2b2b30; color: #fff; font-size: 14px; }
        button { background-color: #f7a600; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; }
        button:hover { background-color: #e09600; }
        .status { margin-top: 15px; padding: 12px; border-radius: 4px; background: #2b2b30; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Bybit Trading Terminal (MAINNET)</h2>
    
    <label>API Key:</label>
    <input type="text" id="apiKey" placeholder="Vnesite Bybit API Key">

    <label>API Secret:</label>
    <input type="password" id="apiSecret" placeholder="Vnesite Bybit API Secret">

    <button onclick="connectBybit()">Shrani in Poveži Bybit</button>

    <div class="status" id="statusBox">Okolje: <b>MAINNET (Pravi Bybit)</b></div>
</div>

<script>
    async function connectBybit() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiSecret = document.getElementById('apiSecret').value.trim();
        const statusBox = document.getElementById('statusBox');

        if (!apiKey || !apiSecret) {
            alert('Prosimo, izpolnite obe polji za ključ!');
            return;
        }

        statusBox.style.color = '#ffffff';
        statusBox.innerHTML = 'Povezovanje z Bybitom...';

        try {
            const res = await fetch('http://localhost:3000/api/balance', {
                method: 'POST',
                headers: { 
                    'Accept': 'application/json',
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ apiKey: apiKey, apiSecret: apiSecret })
            });

            const data = await res.json();

            if (data && data.retCode === 0) {
                statusBox.style.color = '#4CAF50';
                statusBox.innerHTML = '<b>Povezano uspešno!</b><br>Vaš Bybit račun je pripravljen.';
            } else {
                statusBox.style.color = '#f44336';
                statusBox.innerHTML = `<b>Napaka (${data.retCode}):</b> ${data.retMsg}`;
            }
        } catch (err) {
            statusBox.style.color = '#f44336';
            statusBox.innerHTML = `<b>Lokalna napaka:</b> Preverite, ali teče 'node server.js'.`;
        }
    }
</script>

</body>
</html>
